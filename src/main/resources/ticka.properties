# =====================================================================
# TICKA - Parámetros de negocio configurables (RNF-06)
# No contiene credenciales: se versiona en Git. Si se cambia, reiniciar la app.
# =====================================================================

# Minutos que dura la reserva temporal de asientos mientras se paga (RF-18, RN-02).
reserva.minutos=10

# Máximo de asientos por compra (RF-19, RN-04).
compra.maximo=6

# El cliente puede anular su compra hasta estas horas antes de la apertura de puertas (RF-23, RN-12).
anulacion.horas=24

# Re-entrada (RF-31): si es true, un boleto ya usado puede volver a ingresar.
acceso.reentrada=false

# Registrar automáticamente una incidencia "Acceso denegado" por cada rechazo en puerta (RF-35).
acceso.incidenciaPorRechazo=true
